spring.application.name=THERAGENX_api
app.catalog.path=../../catalog/field_catalog.json
app.documents.path=../../documents
app.output.path=../../out
app.fixtures.path=../../fixtures


app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-3.8-flash
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

app.llm.provider=fixture

app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=gpt-4.1-mini
app.openai.base-url=https://api.openai.com/v1

app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=openai/gpt-oss-120b
app.groq.base-url=https://api.groq.com/openai/v1


# Actuator configuration
management.endpoints.web.exposure.include=health,info,mappings

# Show health details
management.endpoint.health.show-details=always

# Swagger configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true
